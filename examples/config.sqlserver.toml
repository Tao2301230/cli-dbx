# Copy to a private connection file; run dbx secret encrypt and add its password line.
[connection]
# Built-in Go driver. To use ODBC instead, set driver = "odbc" and driver_dir.
engine = "sqlserver"
host = "127.0.0.1"
port = 1433
user = "app"
database = "appdb"
schema = "dbo"
allow_actions = ["query"]
